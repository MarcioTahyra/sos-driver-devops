
services:
  sos-driver-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: sos-driver-api:local

    container_name: sos-driver-api

    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"

    user: "10001:10001"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
