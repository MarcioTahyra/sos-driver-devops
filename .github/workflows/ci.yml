
name: SOS Driver - DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python - Tests and Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx bandit pip-audit

      - name: Check Python syntax
        run: python -m compileall -q app tests

      - name: Run automated API tests
        run: python -m pytest -v

      - name: Run Bandit security scan
        run: bandit -r app -ll

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        run: |
          curl -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          mkdir -p /tmp/gitleaks
          tar -xzf gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks git \
            --redact \
            --exit-code 1 \
            --verbose \
            .

  semgrep:
    name: Semgrep - SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep security rules
        run: semgrep scan --config p/security-audit --error app

  terraform:
    name: Terraform - Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  docker:
    name: Docker - Build and Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sos-driver-api:ci .

      - name: Install Trivy
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.69.3

      - name: Scan Docker image with Trivy
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            sos-driver-api:ci

  publish:
    name: Publish - Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - python-security
      - gitleaks
      - semgrep
      - terraform
      - docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build approved image
        run: |
          docker build \
            -t "marciotahyra/sos-driver-api:${GITHUB_SHA}" \
            .

      - name: Publish approved image
        run: |
          docker push "marciotahyra/sos-driver-api:${GITHUB_SHA}"

  deploy:
    name: Deploy - AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: [self-hosted, Linux, X64, sos-driver-deploy]
    timeout-minutes: 15
    concurrency:
      group: sos-driver-production
      cancel-in-progress: false
    env:
      DEPLOY_IMAGE: marciotahyra/sos-driver-api:${{ github.sha }}

    steps:
      - name: Validate image reference
        run: |
          test -n "$DEPLOY_IMAGE"
          echo "Imagem aprovada: $DEPLOY_IMAGE"

      - name: Pull approved image
        run: |
          docker pull "$DEPLOY_IMAGE"

      - name: Replace application container
        run: |
          docker rm -f sos-driver-api || true

          docker run -d \
            --name sos-driver-api \
            --restart unless-stopped \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 8000:8000 \
            "$DEPLOY_IMAGE"

      - name: Verify deployment health
        run: |
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""
              echo "Deploy realizado com sucesso."
              exit 0
            fi
            sleep 2
          done

          echo "ERRO: a API nao respondeu ao health check."
          docker logs --tail 50 sos-driver-api
          exit 1
